name: Build

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags: v0.1.0, v1.0.0, etc.
  workflow_dispatch:  # Manual trigger

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa libgl1-mesa-glx libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests (no Qt)
        run: uv run pytest tests/test_models.py tests/test_shapes.py tests/test_scoring.py tests/test_serializer.py -v

      - name: Run library tests
        run: uv run python -c "from services.library import StageLibrary; lib = StageLibrary(); assert len(lib.list_all()) == 3"

  build:
    name: Build (${{ matrix.os }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa libgl1-mesa-glx libxkbcommon0 libdbus-1-3 patchelf

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build with PyInstaller
        run: uv run python scripts/build.py --verbose

      - name: Create distribution archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar czf ../OpenTDS-linux-x86_64.tar.gz OpenTDS/

      - name: Create distribution archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../OpenTDS-macos-x86_64.zip OpenTDS.app/

      - name: Create distribution archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path OpenTDS -DestinationPath ../OpenTDS-windows-x86_64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opentds-${{ runner.os }}
          path: |
            OpenTDS-linux-x86_64.tar.gz
            OpenTDS-macos-x86_64.zip
            OpenTDS-windows-x86_64.zip
          if-no-files-found: ignore

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            OpenTDS-linux-x86_64.tar.gz
            OpenTDS-macos-x86_64.zip
            OpenTDS-windows-x86_64.zip
          generate_release_notes: true
