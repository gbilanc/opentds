[project]
name = "opentds"
version = "0.1.0"
description = "Open Tactical Dynamic Stage Generator for IPSC practical shooting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-qt>=4.0",
    "ruff>=0.6.0",
    "pyinstaller>=6.0",
]

[project.scripts]
opentds = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "services*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_icons.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
